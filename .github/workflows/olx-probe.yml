name: Probe OLX reachability

# One-off check: can a GitHub runner actually reach olx.uz? Datacenter IPs are
# often blocked by CloudFront, which would rule OLX out before any adapter is
# written. Runs only when the probe itself changes, plus on demand.
on:
  push:
    paths:
      - 'scripts/probe-olx.js'
      - '.github/workflows/olx-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-olx.js
