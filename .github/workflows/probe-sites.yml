name: Probe site reachability

# Which listing sites can a GitHub runner actually reach? Datacenter IPs are
# often blocked by CDNs, which rules a site out before any adapter is
# written. Runs only when the probe itself changes, plus on demand.
on:
  push:
    paths:
      - 'scripts/probe-sites.js'
      - 'scripts/probe-olx-routes.js'
      - 'scripts/test-olx.js'
      - 'src/sources/olx.js'
      - '.github/workflows/probe-sites.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-sites.js

      - name: Every known route into OLX
        if: always()
        run: node scripts/probe-olx-routes.js

      # The adapter can only be exercised here: OLX answers GitHub runners
      # but not this project's other egress.
      - name: OLX adapter against the live site
        if: always()
        run: node scripts/test-olx.js
