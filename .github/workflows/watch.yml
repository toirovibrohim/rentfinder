name: Watch joymee rentals

on:
  # Run on every push to main, so a change can be confirmed immediately.
  # Saving state cannot retrigger this: state.json is excluded below, and the
  # workflow's own state commits carry a skip-ci marker in their message.
  #
  # Careful when writing commit messages: GitHub reads that marker anywhere in
  # the message, body included, so merely mentioning it skips the run.
  push:
    branches: [main]
    paths-ignore:
      - 'state.json'
      - 'README.md'

  schedule:
    # Every 5 minutes — this is the shortest interval GitHub Actions allows.
    # Each run then checks the site once a minute while it is alive, so new
    # listings are picked up within about a minute.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: What to do
        type: choice
        default: check
        options:
          - check          # normal run
          - test-telegram  # send a test message
          - seed           # mark everything currently listed as already seen

# Never let two runs write state.json at the same time.
concurrency:
  group: joymee-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    # Each run polls for ~25 minutes, so the site keeps being checked even
    # when GitHub delays the schedule. Concurrency keeps at most one run
    # going and one waiting, so these chain instead of piling up.
    timeout-minutes: 35

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Optional. Without it only the owner is notified; with it the owner can
      # approve other chats, and the approved list is encrypted at rest.
      SUBSCRIBER_KEY: ${{ secrets.SUBSCRIBER_KEY }}
      ACCESS_HOURS: ${{ vars.ACCESS_HOURS }}
      SEARCH_URLS: ${{ vars.SEARCH_URLS }}
      SEARCH_URL: ${{ vars.SEARCH_URL }}
      # TEMPORARY: short runs so the self-chaining can be verified quickly.
      # Raise back to 25 once the chain is confirmed, so each run covers
      # 25 minutes and survives long gaps in GitHub's schedule.
      POLL_ITERATIONS: '4'
      POLL_INTERVAL_SECONDS: '60'
      PAGES_TO_SCAN: '2'
      # TEMPORARY: the test search matches the whole site, so keep the worst
      # case small. Remove this line when the real filters come back.
      MAX_NOTIFICATIONS_PER_CHECK: '5'

    steps:
      - name: Note the start time
        id: started
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Names the exact missing setting, rather than failing later with a
      # generic error buried in the log.
      - name: Check configuration
        run: |
          missing=0
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::Repository secret $name is missing or empty. Add it under Settings -> Secrets and variables -> Actions -> Secrets."
              missing=1
            else
              echo "$name is set (${#value} characters)"
            fi
          done

          if [ -n "$SUBSCRIBER_KEY" ]; then
            echo "::notice::Access control is ON — the owner can approve other chats, and approvals expire."
          else
            echo "::notice::Access control is OFF — only the owner is notified. Set SUBSCRIBER_KEY to enable it."
          fi

          if [ -n "$SEARCH_URLS" ]; then
            echo "SEARCH_URLS is set (${#SEARCH_URLS} characters)"
          elif [ -n "$SEARCH_URL" ]; then
            echo "SEARCH_URL is set (${#SEARCH_URL} characters)"
          else
            echo "::warning::Neither SEARCH_URLS nor SEARCH_URL is set; falling back to the built-in default searches."
          fi

          exit $missing

      - name: Send a test message
        if: inputs.mode == 'test-telegram'
        run: node src/index.js --test-telegram

      - name: Mark current listings as already seen
        if: inputs.mode == 'seed'
        run: node src/index.js --seed

      - name: Check for new listings
        if: inputs.mode == '' || inputs.mode == 'check'
        run: node src/index.js

      - name: Save what has been notified
        if: always()
        run: |
          if [ -z "$(git status --porcelain state.json subscribers.json)" ]; then
            echo "No state change to commit."
            exit 0
          fi

          git config user.name  "joymee-watcher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if [ -f subscribers.json ]; then git add subscribers.json; fi
          git commit -m "chore: update watcher state [skip ci]" --quiet

          # Another run may have pushed while this one was polling.
          for attempt in 1 2 3; do
            if git push --quiet; then
              echo "State saved."
              exit 0
            fi
            echo "Push rejected, rebasing (attempt $attempt)..."
            git pull --rebase --quiet || git rebase --abort || true
          done

          echo "::warning::Could not save state.json; some listings may be sent twice."

      # Start the next run, so the watcher keeps going without waiting for the
      # schedule. GitHub refuses to let a workflow trigger a workflow with the
      # built-in token, so this needs a PAT in CHAIN_TOKEN. Without one the
      # step does nothing and the schedule stays the only trigger.
      #
      # To stop the chain, delete the CHAIN_TOKEN secret.
      - name: Start the next run
        if: always() && (inputs.mode == '' || inputs.mode == 'check')
        env:
          GH_TOKEN: ${{ secrets.CHAIN_TOKEN }}
          STARTED_AT: ${{ steps.started.outputs.at }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::CHAIN_TOKEN is not set, so this run will not start a successor. Add it to make the watcher self-sustaining."
            exit 0
          fi

          # If this run ended almost immediately something is broken, and
          # chaining would spin in a tight loop. Stop instead.
          elapsed=$(( $(date +%s) - STARTED_AT ))
          if [ "$elapsed" -lt 120 ]; then
            echo "::error::Run finished after only ${elapsed}s, which suggests it is failing immediately. Not starting another run — fix the failure, then push or run the workflow manually."
            exit 0
          fi

          if gh workflow run watch.yml --ref main; then
            echo "Next run requested after ${elapsed}s."
          else
            echo "::error::Could not start the next run, so the watcher has stopped. CHAIN_TOKEN has most likely expired, or lost its Actions read-and-write permission. Renew it at https://github.com/settings/personal-access-tokens, update the CHAIN_TOKEN secret, then push any commit to restart."
            exit 1
          fi
